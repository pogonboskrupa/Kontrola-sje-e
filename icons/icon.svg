<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12281a"/>
      <stop offset="55%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ead0"/>
      <stop offset="100%" stop-color="#e9d3a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- Log cross-section -->
  <circle cx="256" cy="256" r="140" fill="#6b4a30"/>
  <circle cx="256" cy="256" r="126" fill="url(#wood)"/>
  <circle cx="256" cy="256" r="98"  fill="none" stroke="#d9bd8a" stroke-width="6"/>
  <circle cx="256" cy="256" r="68"  fill="none" stroke="#d9bd8a" stroke-width="6"/>
  <circle cx="256" cy="256" r="16"  fill="#c9a876"/>

  <!-- Caliper jaws measuring the diameter -->
  <g fill="#ffffff">
    <rect x="60"  y="238" width="66" height="18" rx="9"/>
    <rect x="110" y="212" width="18" height="88" rx="9"/>
    <rect x="386" y="238" width="66" height="18" rx="9"/>
    <rect x="384" y="212" width="18" height="88" rx="9"/>
  </g>
</svg>
